<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Store the path the user tried to visit
        sessionStorage.setItem('redirect', window.location.href);
        // Redirect to the root (which loads index.html)
        window.location.href = './';
    </script>
</head>

<body>
</body>

</html>
